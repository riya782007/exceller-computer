# Supabase configuration for Exceller Computer Platform
# Reference: https://supabase.com/docs/guides/cli/config

[project]
id = "exceller-computer"

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://excellercomputer.in"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MB"

[realtime]
enabled = true
